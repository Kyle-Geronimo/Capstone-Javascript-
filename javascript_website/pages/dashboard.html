<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HotelLink - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../image/logo/HTLogo.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="chatbot-page">
  <header>
    <div class="container">
      <h1>Dashboard</h1>
      <nav style="visibility:hidden;">
        <a href="../index2.html" class="nav-btn restricted">Home</a>
        <a href="chatbot.html" class="nav-btn restricted">Chatbot Data</a>
        <a href="dashboard.html" class="nav-btn restricted">Dashboard</a>
        <a href="admin.html" class="nav-btn restricted admin-only" style="display:none;">Admin</a>
        <a href="payroll.html" class="nav-btn restricted admin-only" style="display:none;">Payroll</a>
        <a href="profile.html" class="nav-btn restricted">Profile</a>
        <a href="#" id="logout-btn" class="nav-btn restricted">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="reservation-dashboard" class="reservation-dashboard" aria-live="polite"></div>
  </main>

  <footer>
    <div class="container">
      <p style="text-align: center;">&copy; 2025 D' Mariners Inn Hotel. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script>
    (function () {
      function exportGuestTableToPdf() {
        var tbody = document.querySelector('.guest-table tbody');
        if (!tbody) {
          alert('Guest table not found on the page.');
          return;
        }

        var rows = Array.from(tbody.querySelectorAll('tr'));
        if (!rows.length || rows[0].querySelector('.no-data')) {
          alert('No guest records to export.');
          return;
        }

        var jspdfModule = window.jspdf || null;
        var jsPDF = jspdfModule && jspdfModule.jsPDF ? jspdfModule.jsPDF : (window.jsPDF || null);
        if (!jsPDF) {
          alert('PDF library (jsPDF) is not loaded. Please check your network connection.');
          return;
        }

        var doc = new jsPDF('p', 'pt', 'a4');

        var head = [[
          'Guest Name',
          'Hotel',
          'Room',
          'Check-in',
          'Check-out',
          'Status'
        ]];

        var body = [];
        rows.forEach(function (tr) {
          var cells = tr.querySelectorAll('td');
          if (!cells || cells.length < 6) return;
          if (tr.querySelector('.no-data')) return;

          body.push([
            (cells[0].textContent || '').trim(),
            (cells[1].textContent || '').trim(),
            (cells[2].textContent || '').trim(),
            (cells[3].textContent || '').trim(),
            (cells[4].textContent || '').trim(),
            (cells[5].textContent || '').trim()
          ]);
        });

        if (!body.length) {
          alert('No guest records to export.');
          return;
        }

        var tableOpts = {
          head: head,
          body: body,
          startY: 60,
          styles: { fontSize: 9 },
          headStyles: { fillColor: [15, 23, 42] }
        };

        doc.setFontSize(14);
        doc.text('Guest List', 40, 30);

        if (typeof doc.autoTable === 'function') {
          doc.autoTable(tableOpts);
        } else if (typeof window.jspdfAutoTable === 'function') {
          window.jspdfAutoTable(doc, tableOpts);
        } else {
          var y = 50;
          body.forEach(function (row, idx) {
            if (y > 780) {
              doc.addPage();
              y = 40;
            }
            doc.text(String(idx + 1) + '. ' + row.join(' | '), 40, y);
            y += 14;
          });
        }

        doc.save('guest_list.pdf');
      }

      function ensureExportButton() {
        var filters = document.querySelector('.guest-card-header .guest-filters');
        if (!filters) return false;
        if (document.getElementById('guestStaticExportPdfBtn')) return true;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.id = 'guestStaticExportPdfBtn';
        btn.className = 'action-btn secondary';
        btn.textContent = 'Export Guest List (PDF)';
        btn.addEventListener('click', exportGuestTableToPdf);

        filters.insertBefore(btn, filters.firstChild || null);
        return true;
      }

      function initStaticGuestExport() {
        ensureExportButton();

        var attempts = 0;
        var maxAttempts = 30;
        var intervalId = setInterval(function () {
          if (ensureExportButton() || attempts >= maxAttempts) {
            clearInterval(intervalId);
          }
          attempts++;
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStaticGuestExport);
      } else {
        initStaticGuestExport();
      }
    })();
  </script>

  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import { updateNavVisibility, highlightActiveNavBtn } from '../js/nav-control.js';
    import { initReservationDashboard } from '../js/chatbot.js';
    import { logout } from '../js/auth.js';

    auth.onAuthStateChanged((user) => {
      updateNavVisibility();
      highlightActiveNavBtn();

      const container = document.getElementById('reservation-dashboard');
      if (!user) {
        if (container) {
          container.innerHTML = '<div class="auth-message"><p>Please log in to view the dashboard.</p></div>';
        }

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }

      initReservationDashboard();
    });

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await logout();
        } catch (err) {
          console.error('Logout failed from dashboard:', err);
        }
      });
    }
  </script>
</body>
</html>
