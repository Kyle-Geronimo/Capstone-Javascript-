<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelLink - Admin</title>
  <link rel="icon" type="image/png" href="../image/logo/HTLogo.png">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore-compat.js"></script>
  <script>
      // REPLACE with actual VPS IP or domain and the correct port
      // window.API_BASE = 'http://mariners-hotellink.com'; 
    </script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/admin.js"></script>
  <script type="module" src="../js/qr.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>HotelLink</h1>
      <nav style="visibility:hidden;">
        <a href="../index2.html" class="nav-btn restricted">Home</a>
        <a href="chatbot.html" class="nav-btn restricted">Chatbot Data</a>
        <a href="dashboard.html" class="nav-btn restricted">Dashboard</a>
        <a href="admin.html" class="nav-btn restricted admin-only" style="display:none;">Admin</a>
        <a href="payroll.html" class="nav-btn restricted admin-only" style="display:none;">Payroll</a>
        <a href="profile.html" class="nav-btn restricted">Profile</a>
        <a href="#" id="logout-btn" class="nav-btn restricted">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-container chatbot-data-container admin-dashboard">
      <h2>Admin</h2>

      <!-- Account Requests Section -->
      <div class="admin-section">
        <h3>Account Requests</h3>
        <div class="requests-panel">
          <div id="requests" class="request-list">
            <em>Loading requests…</em>
          </div>
        </div>
      </div>

      <!-- Row: [Generate QR] [Request Payroll] -->
      <div class="admin-section" style="display:flex; gap:1.5rem; align-items:flex-start; flex-wrap:wrap;">
        <!-- Employee QR Generator (left column) -->
        <div style="flex:1 1 360px; min-width:0;">
          <h3>Generate QR</h3>
          <form id="createForm" class="qr-generator-form">
            <div class="form-row" style="margin-bottom: 1rem;">
              <label for="employeeSelect">Employee</label>
              <select id="employeeSelect" aria-label="Select employee">
                <option value="">— select employee —</option>
              </select>

              <label for="roleField">Role</label>
              <input id="roleField" readonly placeholder="Auto-filled from users DB" aria-readonly="true" />

              <label for="department">Department</label>
              <select id="department" class="form-control" id="departmentSelect">
                <option value="">— choose department —</option>
                <option value="Bicotels Hotel">Bicotels Hotel</option>
                <option value="D'Mariners Inn Hotel">D'Mariners Inn Hotel</option>
                <option value="Wennrod Hotel">Wennrod Hotel</option>
              </select>

              <label for="shiftSelect">Shift</label>
              <select id="shiftSelect" class="form-control" aria-label="Select shift">
                <option value="">— choose shift —</option>
                <option value="morning">Morning Shift (06:00 - 13:59)</option>
                <option value="mid">Mid Shift (14:00 - 21:59)</option>
                <option value="night">Night Shift (22:00 - 05:59)</option>
              </select>
            </div>

            <button type="submit" class="action-btn primary">Generate QR</button>
          </form>

          <div id="resultArea" style="display:none; margin-top: 2rem; padding: 1.5rem; background: #f8f9fd; border-radius: 8px; border: 1px solid #e8ecf5;">
            <h3 style="color: #1f4ea6; margin-top: 0;">Employee created</h3>
            <div class="generator-result-info" id="info" style="margin-bottom: 1.5rem;"></div>
            <div class="generator-qr-preview" id="qrPreview" style="text-align: center; margin: 1.5rem 0;"></div>
            <div class="generator-result-buttons" style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
              <button id="downloadBtn" class="action-btn">Download PNG</button>
              <button id="printBtn" class="action-btn">Print</button>
            </div>
          </div>

          <div id="status" style="margin-top: 1.5rem;"></div>
        </div>

        <!-- Payroll View Requests panel (right column) -->
        <div id="payroll-requests-wrapper" style="flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:8px; margin-top:0;">
          <!-- Inline banner to show actions taken on payroll requests -->
          <div id="adminPayrollNotice" class="payroll-status" style="display:none;"></div>
          <div id="payroll-requests-panel" class="requests-panel profile-card" style="width:100%;min-width:0;max-height:78vh;overflow:auto;padding:12px;border-radius:8px;">
            <h3 style="margin:0 0 8px 0;">Request Payroll</h3>
            <div id="payrollRequestsList">Loading payroll view requests...</div>
          </div>
        </div>
      </div>

      <!-- User Management Section -->
      <div class="admin-section">
        <div class="section-header">
          <h3>User Management</h3>
          <a href="archives.html" class="action-btn">Archives</a>
        </div>
        <div class="accounts-panel">
          <div id="accounts" class="accounts-list">
            <em>Loading accounts…</em>
          </div>
        </div>
      </div>

    </section>
  </main>

  <footer>
    <div class="container">
      <p style="text-align: center;">&copy; 2025 D' Mariners Inn Hotel. All rights reserved.</p>
    </div>
  </footer>
  
  <script type="module">
    import { auth, getUserRole } from '../js/firebase-config.js';
    import { updateNavVisibility, highlightActiveNavBtn } from '../js/nav-control.js';
    import { watchRequestsRealtime, loadAccounts } from '../js/admin.js';
    import { initializeGenerator } from '../js/qr.js';
    import { logout } from '../js/auth.js';

    updateNavVisibility();
    highlightActiveNavBtn();
    
    auth.onAuthStateChanged(async (user) => {
      updateNavVisibility();
      highlightActiveNavBtn();

      if (!user) {
        // Not signed in, send to login
        window.location.href = 'login.html';
        return;
      }

      // Only allow admins to stay on this page and see User Management
      const role = await getUserRole(user.uid);
      if (role !== 'admin') {
        // Redirect non-admins (employees) away from admin dashboard
        window.location.href = 'profile.html';
        return;
      }

      // Admins: start realtime watchers and enable QR generator
      watchRequestsRealtime(); 
      loadAccounts(); 
      initializeGenerator();
    });
    
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await logout();
        } catch (err) {
          console.error('Logout failed from admin page:', err);
        }
      });
    }
  </script>
</body>
</html>
